name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke-test:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax and frontend build
        run: npm run check

      - name: Smoke test API
        run: |
          npm run server &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:5184/api/review > /tmp/review.json; then
              break
            fi
            sleep 1
          done

          test -s /tmp/review.json
          curl --fail --silent -X POST http://127.0.0.1:5184/api/reset > /tmp/reset.json
          test -s /tmp/reset.json
